name: EX8 Board CI

on:
  push:
    branches:
      - main
    paths:
      - "app/board/**"
      - ".github/workflows/ci.yml"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ex8-board-ci
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          NGINX_IMAGE="${REGISTRY}/std09-ex8-nginx:${GITHUB_SHA}"
          FASTAPI_IMAGE="${REGISTRY}/std09-ex8-fastapi:${GITHUB_SHA}"

          docker build \
            -t "$NGINX_IMAGE" \
            ./app/board/frontend/nginx

          docker build \
            -t "$FASTAPI_IMAGE" \
            ./app/board/backend/fastapi

          docker push "$NGINX_IMAGE"
          docker push "$FASTAPI_IMAGE"

      - name: Update Kubernetes Images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*|\1${REGISTRY}/std09-ex8-nginx:${GITHUB_SHA}|" \
            k8s/apps/board-frontend.yaml

          sed -i -E \
            "s|^([[:space:]]*image:[[:space:]]*).*|\1${REGISTRY}/std09-ex8-fastapi:${GITHUB_SHA}|" \
            k8s/apps/board-backend.yaml

          grep 'image:' k8s/apps/board-frontend.yaml
          grep 'image:' k8s/apps/board-backend.yaml

      - name: Commit Updated Manifests
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            k8s/apps/board-frontend.yaml \
            k8s/apps/board-backend.yaml

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore: update board images ${GITHUB_SHA}"

          git push origin HEAD:main