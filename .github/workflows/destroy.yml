name: EX8 Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "삭제하려면 DESTROY-EX8 입력"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ex8-infrastructure-and-board
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: ex8-destroy

    steps:
      # 1. 삭제 확인
      - name: Confirm Destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "DESTROY-EX8" ]; then
            echo "삭제 확인 문자열이 일치하지 않습니다."
            exit 1
          fi

      # 2. 환경 준비
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform-version: "1.10.5"

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ca-central-1

      # 3. Terraform State 연결
      - name: Terraform Init
        run: terraform -chdir=infra/resource init -input=false

      # 4. EKS 연결
      - name: Configure EKS
        run: |
          aws eks update-kubeconfig \
            --name std09-ex8-k8s \
            --region ca-central-1

          kubectl get nodes

      # 5. Argo CD Application 및 관리 리소스 삭제
      - name: Delete Argo CD Application
        run: |
          set -euo pipefail

          if kubectl get application ex8-board \
            -n argocd >/dev/null 2>&1; then

            kubectl patch application ex8-board \
              -n argocd \
              --type merge \
              -p '{"metadata":{"finalizers":["resources-finalizer.argocd.argoproj.io"]}}'

            kubectl delete application ex8-board \
              -n argocd \
              --wait=true \
              --timeout=15m
          fi

      # 6. Ingress 정리
      - name: Delete Ingress
        run: |
          set -euo pipefail

          if kubectl get namespace ex8 >/dev/null 2>&1; then
            kubectl delete ingress board-ingress \
              -n ex8 \
              --ignore-not-found \
              --wait=true \
              --timeout=10m
          fi

      # 7. Kubernetes에 LoadBalancer 관련 리소스가
      # 남아 있으면 삭제 중단
      - name: Verify Kubernetes Cleanup
        run: |
          set -euo pipefail

          INGRESS=$(kubectl get ingress -A \
            -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}')

          LB_SVC=$(kubectl get svc -A \
            -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}/{.metadata.name}{"\n"}{end}')

          if [ -n "$INGRESS" ] || [ -n "$LB_SVC" ]; then
            echo "Ingress 또는 LoadBalancer Service가 남았습니다."
            echo "$INGRESS"
            echo "$LB_SVC"
            exit 1
          fi

      # 8. AWS Load Balancer 실제 삭제 확인
      - name: Verify AWS Load Balancers
        run: |
          set -euo pipefail

          VPC_ID=$(terraform -chdir=infra/resource \
            output -raw vpc_id)

          test -n "$VPC_ID"

          for i in $(seq 1 40); do

            ALB_COUNT=$(aws elbv2 describe-load-balancers \
              --region ca-central-1 \
              --query "length(LoadBalancers[?VpcId=='${VPC_ID}'])" \
              --output text)

            CLB_COUNT=$(aws elb describe-load-balancers \
              --region ca-central-1 \
              --query "length(LoadBalancerDescriptions[?VPCId=='${VPC_ID}'])" \
              --output text)

            TG_COUNT=$(aws elbv2 describe-target-groups \
              --region ca-central-1 \
              --query "length(TargetGroups[?VpcId=='${VPC_ID}'])" \
              --output text)

            if [ "$ALB_COUNT" = "0" ] &&
               [ "$CLB_COUNT" = "0" ] &&
               [ "$TG_COUNT" = "0" ]; then

              echo "로드 밸런서 및 Target Group 정리 완료"
              exit 0
            fi

            echo "AWS 리소스 삭제 확인 중"
            sleep 15
          done

          echo "AWS 리소스가 남아 있습니다. Terraform 삭제 중단."
          exit 1

      # 9. Helm Controller 삭제
      - name: Uninstall ALB Controller
        run: |
          helm uninstall aws-load-balancer-controller \
            -n kube-system \
            --ignore-not-found \
            --wait \
            --timeout 10m

      # 10. 실습 Namespace 삭제
      - name: Delete Namespaces
        run: |
          kubectl delete namespace ex8 argocd \
            --ignore-not-found \
            --wait=true \
            --timeout=10m

      # 11. Terraform 삭제 계획 생성
      - name: Terraform Destroy Plan
        run: |
          terraform -chdir=infra/resource plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan

      # 12. Terraform 삭제 실행
      - name: Terraform Destroy
        run: |
          terraform -chdir=infra/resource apply \
            -input=false \
            destroy.tfplan